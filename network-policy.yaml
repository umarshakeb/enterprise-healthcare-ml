apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-only-gradio
spec:
  podSelector:
    matchLabels:
      app: healthcare-api # Targets your backend API
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: healthcare-gradio # Permits connections ONLY from the Gradio UI pod
      ports:
        - protocol: TCP
          port: 8000
