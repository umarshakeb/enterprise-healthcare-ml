name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx "dvc[s3]" bandit

      # SECURITY PROVENANCE 1: Scan Python source code for vulnerabilities
      - name: Run Python Security Audits (Bandit)
        run: |
          bandit -r src/ api/ -v

      # SECURITY PROVENANCE 2: Scan Kubernetes Configuration Manifests
      - name: Run Kubernetes Manifest Security Audit (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          exit-code: '1' # Fails the entire pipeline if a critical misconfiguration is found
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_DEFAULT_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Pull DVC artifacts
        run: |
          dvc pull -v

      # Testing validation blocks
      - name: Run API tests
        run: |
          python -m pytest tests/test_routes.py -v

      - name: Run feature schema tests
        run: |
          python -m pytest tests/test_schema.py -v

      - name: Run model artifact tests
        run: |
          python -m pytest tests/test_artifacts.py -v
