name: CD Pipeline - Production Deployment

on:
  push:
    branches:
      - main
  # Ensures deployment only starts AFTER the CI testing pipeline passes successfully
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy-local:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SECURE GATEWAY: Decodes your local Minikube cluster configuration token dynamically
      - name: Setup Kubernetes Access Configuration
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config

      # DEPLOYMENT GATE: Applies the Zero-Trust hardened configurations to Minikube
      - name: Deploy Secure Manifests to Minikube
        run: |
          kubectl apply -f network-policy.yaml
          kubectl apply -f deployment-api.yaml
          kubectl apply -f deployment-gradio.yaml
          
          # Forces a zero-downtime rolling update to pick up fresh code logic safely
          kubectl rollout restart deployment/healthcare-api-deployment
          kubectl rollout restart deployment/healthcare-gradio-deployment
